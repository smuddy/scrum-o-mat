<div @fadeTranslateInstant class="div-init">
  @if (errorMessage) {
    <div>{{errorMessage}}</div>
  }
  <div class="div-estimate-id">
    <input (keyup.enter)="login()" [formControl]="email" name="email" placeholder="E-Mail Addresse" type="text">
  </div>
  <div class="div-estimate-id">
    <input (keyup.enter)="login()" [formControl]="pass" name="pass" placeholder="Passwort" type="password">
  </div>
  <app-button variant="primary" full (click)="login()" [disabled]="!email || !pass">Anmelden</app-button>
  <app-button full (click)="register()" [disabled]="!email || !pass">Registrieren</app-button>
</div>
