<div [class.middle]="middle" class="div-issue" @fade>
  <div class="div-subject">{{subject}}</div>
  <input #input
    (keyup.enter)="setIssue()"
    [(ngModel)]="issue"
    [disabled]="!edit"
    placeholder="Schätzung für"
    type="text">
    @if (edit) {
      <app-icon-button [icon]="faCheck" label="Bestätigen" (click)="setIssue()"/>
    }
    @if (!edit) {
      <app-icon-button [icon]="faTimes" label="Zurücksetzen" (click)="resetIssue()"/>
    }
  </div>
