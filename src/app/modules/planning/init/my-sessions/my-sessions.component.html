<div class="head">Meine Schätzungen</div>

@for (planning of plannings; track planning.id) {
  <div class="planning">
    <div [routerLink]="'/planning/' + planning.id + '/master'" class="link">
      <div>{{planning.subject}}</div>
      <div class="date">{{planning.modified.seconds * 1000  | date:'dd.MM.yyyy HH.mm'   }}</div>
    </div>
    <div class="delete">
      <button (click)="delete(planning.id)" aria-label="Löschen" class="icon-btn" type="button">
        <fa-icon [icon]="faTrash"></fa-icon>
      </button>
    </div>
  </div>
}
