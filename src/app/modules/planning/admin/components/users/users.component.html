@for (user of users; track user.id) {
  <div>
    <div class="div-planning-users">
      <div>
        <button (click)="delete(user.id)" aria-label="Löschen" class="icon-btn" type="button">
          <fa-icon [icon]="faTrash"></fa-icon>
        </button>
      </div>
      <div>{{user.name}}</div>
    </div>
  </div>
}
