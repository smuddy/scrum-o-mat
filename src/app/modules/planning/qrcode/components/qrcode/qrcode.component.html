<div class="div-scan">
  @if (showScanner) {
    <zxing-scanner (scanSuccess)="scanSuccessHandler($event)" @fade
    [formats]="format"></zxing-scanner>
  }
  @if (showText) {
    <div @fade class="div-planning-id">Session gefunden</div>
  }
  @if (showText) {
    <div @fade class="div-planning-id">{{subject}}</div>
  }
</div>
